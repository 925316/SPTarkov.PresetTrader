# Continuous deployment: every push to master rebuilds the Release mod package
# and overwrites the rolling "latest" GitHub release, so the Releases page always
# hosts the newest build under a permanent download link. The mod version (for
# the release notes) is read from ModMetadata in src/modmetadata.cs.

name: release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SPTarkov.PresetTrader.sln -c Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          # Mod metadata moved to src/modmetadata.cs when main.cs was split.
          $line = (Get-Content src/modmetadata.cs | Select-String -Pattern 'SemanticVersioning\.Version Version').Line
          $modVersion = [regex]::Match($line, '"([^"]+)"').Groups[1].Value
          if (-not $modVersion) {
            Write-Error "Could not read mod version from src/modmetadata.cs"
            exit 1
          }
          "version=$modVersion" >> $env:GITHUB_OUTPUT

          # Zip keeps the SPT_Runtime tree so users extract it straight into the server root.
          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive -Path Build/Release/SPT_Runtime -DestinationPath dist/SPTarkov.PresetTrader.zip -Force
          $hash = (Get-FileHash dist/SPTarkov.PresetTrader.zip -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish to the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "dist/SPTarkov.PresetTrader.zip"
          $commit = "${{ github.sha }}".Substring(0, 7)
          $notes = "PresetTrader ${{ steps.package.outputs.version }}`nBuilt from commit $commit`nSHA256: ${{ steps.package.outputs.sha256 }}"
          gh release upload latest $asset --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create latest $asset --title "PresetTrader latest" --target ${{ github.sha }} --notes $notes
          } else {
            gh release edit latest --target ${{ github.sha }} --notes $notes
          }
          # Force-update the tag so it always points at the latest commit
          git tag -f latest ${{ github.sha }}
          git push -f origin latest
